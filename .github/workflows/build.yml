name: Build Check

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'DVModProfiles/**'
      - '**/*.md'
  pull_request:
    branches: [dev]
    paths-ignore:
      - 'DVModProfiles/**'
      - '**/*.md'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build DVModManager/DVModManager.csproj -c Release
