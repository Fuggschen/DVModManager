name: Build Check
permissions:
  contents: read

on:
  push:
    branches: [main, beta]
    paths-ignore:
      - 'DVModProfiles/**'
      - '**/*.md'
  pull_request:
    branches: [main, beta]
    paths-ignore:
      - 'DVModProfiles/**'
      - '**/*.md'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build DVModManager/DVModManager.csproj -c Release
